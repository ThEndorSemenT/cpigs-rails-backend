# Nginx configuration for cpigs-backend (staging)
# Install after first deploy:
#   sudo cp /var/www/cpigs-backend/current/config/staging/nginx.conf /etc/nginx/sites-available/cpigs-backend
#   sudo ln -s /etc/nginx/sites-available/cpigs-backend /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# After installing, run certbot for TLS:
#          sudo certbot --nginx -d cpigs.to

upstream cpigs_backend {
  server 127.0.0.1:3001;
}

server {
  listen 80;
  server_name cpigs.to;

  root /var/www/cpigs-backend/current/public;

  # Serve static assets directly with caching
  location ^~ /assets/ {
    gzip_static on;
    expires max;
    add_header Cache-Control public;
  }

  # Try static files first, then proxy to Rails
  try_files $uri/index.html $uri @app;

  location @app {
    proxy_pass http://cpigs_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;

    # WebSocket support (if needed later)
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  error_page 500 502 503 504 /500.html;
  client_max_body_size 10M;
  keepalive_timeout 10;
}
