default: &default
  # Must match the cron in config/schedule.yml.
  # Used as fallback window on the very first run (no Redis last_run stored yet).
  # Budget: 100 req/day ÷ languages. With 2 languages: max 50 runs/day → every 30 min.
  fetch_interval_minutes: 30
  relevance_threshold: 0.7
  max_audit_versions: 10
  short_url_base: "https://cpigs.to"
  languages:
    # NewsAPI's `pt` language filter returns articles from any Portuguese-speaking
    # country — in practice the results are overwhelmingly Brazilian because
    # NewsAPI indexes no Portuguese (Portugal) outlets. This feed therefore covers
    # Brazilian corruption news. The keyword filter still rejects off-topic articles
    # (politics, sport, finance) before they reach Telegram.
    - code: "pt"
      keywords: "corrupção OR suborno OR peculato OR lavagem de dinheiro OR desvio de verbas OR propina OR fraude licitação"
      telegram_chat_id: "@cpigsgame"
      telegram_topic_id: 2
    # English feed: international corruption stories worldwide.
    # "kickback" and "graft" removed from the API query — too obscure as search
    # terms (near-zero results on NewsAPI). The keyword filter still matches them
    # in article bodies.
    - code: "en"
      keywords: "corruption OR bribery OR embezzlement OR fraud OR \"money laundering\""
      telegram_chat_id: "@cpigsgame"
      telegram_topic_id: 4

development:
  <<: *default
  short_url_base: "http://localhost:3000"

test:
  <<: *default
  short_url_base: "http://localhost:3000"

production:
  <<: *default
