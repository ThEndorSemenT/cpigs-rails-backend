# config/settings.yml
# Application-wide settings. Only settings actually read from code belong here —
# consumers: Blockchain::NotifyResultJob (game section) and
# config/initializers/simulation.rb (simulation section). Values come
# from env vars; per-environment overrides are handled by each environment's
# own .env, not by sections in this file.
#
# Secrets (API keys) go in Rails credentials (config/credentials.yml.enc), not
# here. This file is safe to commit.

default: &default
  game:
    # URL of the Polygon-side endpoint that receives game results.
    result_api_url: <%= ENV.fetch("GAME_RESULT_API_URL", nil) %>
    # Auth key for the game result API.
    # TODO: move to Rails credentials (rails credentials:edit) — requires TTY.
    result_api_key: <%= ENV.fetch("GAME_RESULT_API_KEY", nil) %>

  # Simulation mode: NFT ownership comes from the simulated_nfts table and every
  # chain touchpoint (result notification, RPC proxy) is disabled. Off by default.
  simulation:
    enabled: <%= ENV.fetch("SIMULATION_MODE", "false") %>
    collection: <%= ENV.fetch("SIMULATION_COLLECTION", "cpigs-collection-879234287") %>

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
